# Tool configuration only. This repository is not an installable Python package:
# there is no [project] table and nothing is published to PyPI. Install
# dependencies from requirements.txt / requirements-dev.txt after cloning.

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = "\\.worktrees/"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".worktrees"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
