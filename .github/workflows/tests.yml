name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    # Every suite here runs with no Hermes, no board, no network — that is the point of
    # the board abstraction. Anything that genuinely needs a live install is in
    # tests/smoke.sh and runs on the KSM box.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Check formatting and lint
        run: |
          black --check dev gateway mcp profiles sync tests triggers
          ruff check .
      - name: Configure git (the sync tests drive real repos)
        run: |
          git config --global user.email "ci@kanban-surface"
          git config --global user.name "ks-ci"
          git config --global init.defaultBranch main
      - name: Run offline suites
        run: ./tests/run_all.sh
      - name: Validate Compose topology
        run: docker compose config --quiet
